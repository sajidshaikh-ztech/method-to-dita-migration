# Migration Configuration
migration.input.file=src/main/resources/input/method.xml
migration.output.dir=src/main/resources/output/
migration.xslt.process.items=src/main/resources/xslt/process-items.xsl

# MySQL Staging Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/EYMethods?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=passw0rd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
